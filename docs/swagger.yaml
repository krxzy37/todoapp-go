host: 127.0.0.1:5050
info:
  contact: {}
  description: Todo application rest-api scheme
  title: todoapp golang api
  version: "1.0"
paths:
  /statistics:
    get:
      description: Get task statistics with optional filtering by user_id and/or time
        period
      parameters:
      - description: Filter statistics by specific user
        in: query
        name: user_id
        type: integer
      - description: 'Start of the statistics review period (inclusive), format: YYYY-MM-DD'
        in: query
        name: from
        type: string
      - description: 'End of the statistics review period (exclusive), format: YYYY-MM-DD'
        in: query
        name: to
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Successfully retrieved statistics
          schema:
            $ref: '#/definitions/internal_features_statistics_transport_http.GetStatisticsResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: Get statistics
      tags:
      - statistics
  /tasks:
    get:
      description: View a list of tasks with optional pagination and/or filtering
        by task author ID
      parameters:
      - description: Filter tasks by author ID
        in: query
        name: user_id
        type: integer
      - description: Page size for tasks
        in: query
        name: limit
        type: integer
      - description: Page offset for tasks
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: List of tasks
          schema:
            items:
              $ref: '#/definitions/internal_features_tasks_transport_http.TaskDTOResponse'
            type: array
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: List of tasks
      tags:
      - tasks
    post:
      consumes:
      - application/json
      description: Create a new task in the system
      parameters:
      - description: CreateTask request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Successfully created task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.CreateTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Author not found
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: Create a task
      tags:
      - tasks
  /tasks/{id}:
    delete:
      description: Delete an existing task in the system by its ID
      parameters:
      - description: ID of the task to delete
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: Task successfully deleted
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: Delete a task
      tags:
      - tasks
    get:
      description: Get a specific task by its ID
      parameters:
      - description: ID of the task to get
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Task successfully found
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.GetTaskResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: Get a task
      tags:
      - tasks
    patch:
      consumes:
      - application/json
      description: |-
        Updates information about an already existing task in the system
        ### Field update logic (Three-state logic):
        1. **Field not provided**: `description` is ignored, the value in the DB does not change
        2. **Value explicitly provided**: `"description": "Go for a walk with Bobik at 06:30 AM"`
        3. **Explicitly passed null**: `"description": null` - clears the field in the DB (set to NULL)
        Restrictions: `title` and `completed` cannot be set to null
      parameters:
      - description: ID of the task to update
        in: path
        name: id
        required: true
        type: integer
      - description: PatchTask request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_tasks_transport_http.PatchTaskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully updated task
          schema:
            $ref: '#/definitions/internal_features_tasks_transport_http.PatchUserResponse'
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: Task not found
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: Update a task
      tags:
      - tasks
  /user/{id}:
    get:
      description: get user by ID
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: get user success
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.GetUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: get user
      tags:
      - users
  /users:
    get:
      description: users list with optional pagination
      parameters:
      - description: page size with users
        in: query
        name: limit
        type: integer
      - description: page offset with users
        in: query
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Success get users list
          schema:
            items:
              $ref: '#/definitions/internal_features_users_transport_http.UserDtoResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: users list
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Create new user in system
      parameters:
      - description: CreateUser request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.CreateUserRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Success create user
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.CreateUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: Create user
      tags:
      - users
  /users/{id}:
    delete:
      description: deleting user that exist in system by id
      parameters:
      - description: id deleting user
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: delete user success
        "400":
          description: Bad request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: Deleting user
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: |-
        change existing user info in system
        ### Logic fields update (three-state logic):
        1. **The field was not entered by the user**: ignore, the value in the database does not change
        2. **The value is explicitly passed**: `"phone_number": "+380604356393` -  changing phone number
        3. **passed null**: clears a field in the database
        Restrictions: `full_name` cant be null
      parameters:
      - description: user id
        in: path
        name: id
        required: true
        type: integer
      - description: PatchUser request body
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_features_users_transport_http.PatchUserRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Success patch user
          schema:
            $ref: '#/definitions/internal_features_users_transport_http.PatchUserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "404":
          description: User Not Found
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_krxzy37_todoapp-go_internal_core_transport_http_response.ErrorResponse'
      summary: patch user
      tags:
      - users
swagger: "2.0"
